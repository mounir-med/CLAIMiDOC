[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimidoc-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic>=2.8,<3", "pydantic-settings>=2.4",
  "sqlalchemy>=2.0,<2.1", "alembic>=1.13", "psycopg[binary]>=3.2",
  "pyjwt>=2.8", "python-multipart", "httpx>=0.27",
  "qdrant-client>=1.11", "langchain-core>=0.3", "langgraph>=0.2", "langgraph-checkpoint-postgres>=2.0",
  "mcp>=1.2,<2", "pymupdf>=1.24", "pytesseract>=0.3", "pillow>=10", "numpy>=1.26",
  "minio>=7.2", "aiogram>=3.13",
]
[project.optional-dependencies]
ml = ["FlagEmbedding>=1.2", "sentence-transformers>=3.0", "torch>=2.3", "transformers>=4.45", "mlflow>=2.15"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "reportlab>=4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["ocr: nécessite tesseract", "ml: nécessite des modèles lourds"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
