[tool.ruff]
line-length = 120
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "E701", "E702", "S101", "S311", "B008", "S608", "S105", "S106", "S110", "S603", "UP017", "UP037"]
[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S105", "S106", "S108"]
